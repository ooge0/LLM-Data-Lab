[[requirement]]
id = "REQ-CASC-L0-01"
feature = "FEAT-CASC-L0"
value = "High"
text = "A raw response that is empty, whitespace-only, or JSON with an empty `text` value is classified `EMPTY`"

[[requirement]]
id = "REQ-CASC-L0-02"
feature = "FEAT-CASC-L0"
value = "High"
text = "Non-JSON text is classified `TRUNCATED` when it looks cut off and `MALFORMED_JSON` otherwise"

[[requirement]]
id = "REQ-CASC-L0-03"
feature = "FEAT-CASC-L0"
value = "High"
text = "Valid JSON without the `{\"text\": ...}` object shape is `SCHEMA_ERROR`; with it, `VALID`"

[[requirement]]
id = "REQ-CASC-L0-04"
feature = "FEAT-CASC-L0"
value = "High"
text = "A Layer-0-rejected response skips metrics and the judge and is persisted with `v_ok=False`, `v_decided_by=\"layer0\"` and its raw text in `output`"

[[requirement]]
id = "REQ-CASC-L0-05"
feature = "FEAT-CASC-L0"
value = "Low"
text = "`API_ERROR` and `FORMAT_ERROR` are assigned to responses"
known_gap = true

[[requirement]]
id = "REQ-CASC-L1-01"
feature = "FEAT-CASC-L1"
value = "High"
text = "`is_echo_response` rejects `semantic_overlap` above 0.5, pinned on the real calibration scores and at the boundary"

[[requirement]]
id = "REQ-CASC-L1-02"
feature = "FEAT-CASC-L1"
value = "High"
text = "An echo-rejected response never reaches the judge, keeps its metric fields and is marked `v_decided_by=\"layer1\"`"

[[requirement]]
id = "REQ-CASC-L2-01"
feature = "FEAT-CASC-L2"
value = "Medium"
text = "The NLI check runs only when both the RAG context and the response are non-empty; otherwise `checked=False`"

[[requirement]]
id = "REQ-CASC-L2-02"
feature = "FEAT-CASC-L2"
value = "Medium"
text = "A clear factual contradiction is labelled `contradiction`, a consistent response is not, and the score is a probability in [0, 1]"

[[requirement]]
id = "REQ-CASC-L2-03"
feature = "FEAT-CASC-L2"
value = "Medium"
text = "The NLI check is skipped for echo-rejected rows and runs exactly once for a non-echo row with RAG on"

[[requirement]]
id = "REQ-CASC-L2-04"
feature = "FEAT-CASC-L2"
value = "Medium"
text = "Layer 2 gates responses on a threshold calibrated on real RAG-enabled data"
known_gap = true

[[requirement]]
id = "REQ-CASC-L2-05"
feature = "FEAT-CASC-L2"
value = "Low"
text = "Sentiment and toxicity classifiers score each response"
known_gap = true

[[requirement]]
id = "REQ-CASC-L3-01"
feature = "FEAT-CASC-L3"
value = "High"
text = "The judge parses real JSON into `{verdict, confidence, rationale}`: a clear pass and a clear fail (CLAUDE.md section 4)"

[[requirement]]
id = "REQ-CASC-L3-02"
feature = "FEAT-CASC-L3"
value = "High"
text = "An unparseable judge reply yields `verdict=False`, `confidence=0.0`, `parse_failed=True`, distinguishable from a genuine \"no\""

[[requirement]]
id = "REQ-CASC-L3-03"
feature = "FEAT-CASC-L3"
value = "Medium"
text = "Confidence is clamped to [0, 1]; missing confidence or rationale stay `None`"

[[requirement]]
id = "REQ-CASC-L3-04"
feature = "FEAT-CASC-L3"
value = "Medium"
text = "The judge request asks for JSON mode and goes to the per-call model (student in self-critic mode, teacher otherwise)"

[[requirement]]
id = "REQ-CASC-ROUTE-01"
feature = "FEAT-CASC-ROUTE"
value = "High"
text = "Routing is fixed Python control flow (Layer 0, metrics, Layer 1, Layer 2, Layer 3); a genuine response reaches the judge"

[[requirement]]
id = "REQ-CASC-ROUTE-02"
feature = "FEAT-CASC-ROUTE"
value = "High"
text = "`v_decided_by` records who decided: `layer0`, `layer1`, `judge` or `judge_parse_failure`"

[[requirement]]
id = "REQ-MET-SEM-01"
feature = "FEAT-MET-SEM"
value = "High"
text = "`semantic_similarity` is sentence-embedding cosine: identical text 1.0, paraphrase high, unrelated low, symmetric, clamped to [0, 1], empty text 0 without a model call"

[[requirement]]
id = "REQ-MET-SEM-02"
feature = "FEAT-MET-SEM"
value = "High"
text = "The persisted `semantic_overlap` field uses that similarity, not token overlap, and the fix leaves other fields unchanged"

[[requirement]]
id = "REQ-MET-LING-01"
feature = "FEAT-MET-LING"
value = "High"
text = "`zipf_deviation` matches a hand-computed RMSE and is zero or non-negative on edge inputs"

[[requirement]]
id = "REQ-MET-LING-02"
feature = "FEAT-MET-LING"
value = "Medium"
text = "Social focus contrasts with self focus; hedge and booster ratios match fixed sentences and are zero on empty text"

[[requirement]]
id = "REQ-MET-LING-03"
feature = "FEAT-MET-LING"
value = "High"
text = "`cognitive_load` averages three min-max-normalized components, equals 0.2 on the hand-computed sentence and stays in [0, 1]"

[[requirement]]
id = "REQ-MET-LING-04"
feature = "FEAT-MET-LING"
value = "Medium"
text = "`dependency_distance` matches 2.286 on a fixed sentence, returns 0 for empty or one-token text, is rounded to 3 decimals"

[[requirement]]
id = "REQ-MET-LING-05"
feature = "FEAT-MET-LING"
value = "High"
text = "TTR, readability ARI, coherence, modality and self focus are pinned on known inputs"
known_gap = true

[[requirement]]
id = "REQ-MET-REC-01"
feature = "FEAT-MET-REC"
value = "High"
text = "Colliding metric keys keep both values (`self_focus`/`self_focus_ext`, `word_count`/`word_count_raw`, `ms_per_word`/`ms_per_word_raw`)"

[[requirement]]
id = "REQ-MET-REC-02"
feature = "FEAT-MET-REC"
value = "Medium"
text = "Ollama telemetry is persisted and `tokens_per_second` is derived, or `None` when the inputs are missing"

[[requirement]]
id = "REQ-GEN-OLL-01"
feature = "FEAT-GEN-OLL"
value = "High"
text = "Calls native `/api/chat` with separate system and user messages, JSON format only in JSON mode, host derived from config with `/v1` stripped"

[[requirement]]
id = "REQ-GEN-OLL-02"
feature = "FEAT-GEN-OLL"
value = "Medium"
text = "Token counts and nanosecond durations are mapped to fields in milliseconds; absent fields stay `None`"

[[requirement]]
id = "REQ-GEN-PROMPT-01"
feature = "FEAT-GEN-PROMPT"
value = "Medium"
text = "Tuned, Blind and Raw modes build their specified prompts, exclude-archetype is honoured, an unknown mode raises"

[[requirement]]
id = "REQ-GEN-RUN-01"
feature = "FEAT-GEN-RUN"
value = "High"
text = "The sweep range is computed correctly (linear, delta, descending, 2-decimal rounding) and each value is run with exactly one parameter overridden"

[[requirement]]
id = "REQ-GEN-RUN-02"
feature = "FEAT-GEN-RUN"
value = "High"
text = "Total tasks equal students x archetypes x biases x steps, and a full grid produces exactly that many entries"

[[requirement]]
id = "REQ-GEN-RUN-03"
feature = "FEAT-GEN-RUN"
value = "High"
text = "Invalid configs are rejected before any generation: missing teacher without self-critic, sweep without a range, more tasks than the cap"

[[requirement]]
id = "REQ-GEN-RUN-04"
feature = "FEAT-GEN-RUN"
value = "High"
text = "Only one run at a time; a generation error emits an error event and frees the guard"

[[requirement]]
id = "REQ-GEN-RUN-05"
feature = "FEAT-GEN-RUN"
value = "Medium"
text = "A stop request halts a run early, the flag resets on the next start, and stopping with nothing running is refused"

[[requirement]]
id = "REQ-GEN-RUN-06"
feature = "FEAT-GEN-RUN"
value = "Medium"
text = "`extract_best_text` returns the `text` key of a JSON object and falls back to the raw text otherwise"

[[requirement]]
id = "REQ-GEN-RAG-01"
feature = "FEAT-GEN-RAG"
value = "Medium"
text = "With RAG on, the query is built from archetype and bias, chunks are injected and RAG fields persisted; with RAG off the knowledge base is ignored"

[[requirement]]
id = "REQ-GEN-RAG-02"
feature = "FEAT-GEN-RAG"
value = "Medium"
text = "The knowledge base is built lazily, a failed load is not cached, and an unbuildable one returns 400, not 500"

[[requirement]]
id = "REQ-GEN-RAG-03"
feature = "FEAT-GEN-RAG"
value = "Low"
text = "The `KnowledgeBase` adapter delegates to `RAGEngine` with the right parameter names and defaults"

[[requirement]]
id = "REQ-GEN-SSE-01"
feature = "FEAT-GEN-SSE"
value = "High"
