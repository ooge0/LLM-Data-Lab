[[requirement]]
id = "REQ-DATA-EXP-04"
feature = "FEAT-DATA-EXP"
value = "High"
text = "After an export the status cell is replaced in place (out-of-band swap) only on success, never stacked with the old value, and a re-export shows the newer timestamp"

[[requirement]]
id = "REQ-DATA-CON-01"
feature = "FEAT-DATA-CON"
value = "Medium"
text = "`LabDataBridge` maps raw entries to `LabSchema` (parsing, dataframe, no NaN in critical fields, POS mapping, prefixed neuro fields), preferring `self_focus_ext` and falling back for old entries"

[[requirement]]
id = "REQ-CORP-CL-01"
feature = "FEAT-CORP-CL"
value = "High"
text = "Fit indices (silhouette, Davies-Bouldin, label-alignment ARI, noise ratio) match pinned values on synthetic embeddings, with sentinels for a single cluster"

[[requirement]]
id = "REQ-CORP-CL-02"
feature = "FEAT-CORP-CL"
value = "Medium"
text = "Plain HDBSCAN and the UMAP+HDBSCAN behavioural topology add their columns, filter invalid and short responses, label outliers as noise, and survive filtering every row"

[[requirement]]
id = "REQ-CORP-CL-03"
feature = "FEAT-CORP-CL"
value = "Medium"
text = "K-Means+PCA clustering adds cluster and PCA columns, is a no-op on too few rows or no numeric data, and exposes component drivers only after fitting"

[[requirement]]
id = "REQ-CORP-HYP-01"
feature = "FEAT-CORP-HYP"
value = "Medium"
text = "Mean-shift comparison between two archetypes reports real means, flags shifts over 50 percent, gives `None` when the base mean is 0, ignores nulls and fails clearly on missing data"

[[requirement]]
id = "REQ-CORP-HYP-02"
feature = "FEAT-CORP-HYP"
value = "Medium"
