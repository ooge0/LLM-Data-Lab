[[requirement]]
id = "REQ-GEN-SSE-02"
feature = "FEAT-GEN-SSE"
value = "Medium"
text = "The stream yields ordered progress events then closes; a stream without a started run sends an error and closes"

[[requirement]]
id = "REQ-GEN-SSE-03"
feature = "FEAT-GEN-SSE"
value = "Medium"
