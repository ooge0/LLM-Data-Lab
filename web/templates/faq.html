<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
  (function(){
    try {
      var theme = localStorage.getItem("nn_lab_theme") === "light" ? "light" : "dark";
      if (theme === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
      // Keeps the server-side cookie (read by web/plotting/render.py for chart theming)
      // in sync with localStorage on every load, not just on a toggle click -- so a
      // preference set before this cookie mirroring existed still self-heals.
      document.cookie = "nn_lab_theme=" + theme + "; path=/; max-age=31536000; samesite=lax";
      if (localStorage.getItem("nn_lab_sidebar_collapsed") === "1") {
        document.documentElement.classList.add("sidebar-collapsed");
      }
    } catch (e) {}
  })();
  </script>
  <title>nn_lab -- FAQ</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" crossorigin="anonymous">
  <script src="/static/vendor/htmx/htmx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" crossorigin="anonymous" defer></script>
</head>
<body>
<div class="app-shell">
  {% include "_nav.html" %}
  <main>
  <h1>User guide &amp; metric methodology</h1>

  <label>
    Select language
    {% for option in languages %}
    <a href="/faq?lang={{ option | urlencode }}"
       style="{% if option == lang %}font-weight: bold; text-decoration: underline;{% endif %} margin-right: 1em;">
      {{ option }}
    </a>
    {% endfor %}
  </label>

  {% if error %}
  <p>{{ error }}</p>
  {% else %}
  <div>{{ content_html | safe }}</div>
  {% endif %}
  </main>
</div>
<script>
  // Render math elements produced by the dollarmath markdown-it plugin.
  // Single-dollar formulas become <span class="math inline">;
  // block-styled (standalone paragraph) formulas are centered via CSS.
  document.addEventListener("DOMContentLoaded", function () {
    if (typeof katex === "undefined") return;
    document.querySelectorAll(".math.block").forEach(function (el) {
      try { katex.render(el.textContent, el, { displayMode: true, throwOnError: false }); }
      catch (e) {}
    });
    document.querySelectorAll(".math.inline").forEach(function (el) {
      try { katex.render(el.textContent, el, { displayMode: false, throwOnError: false }); }
      catch (e) {}
    });
  });
</script>
</body>
</html>
